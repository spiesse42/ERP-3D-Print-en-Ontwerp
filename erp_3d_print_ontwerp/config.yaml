# Home Assistant add-on - ERP 3D Print & Ontwerp (stap 8)
# LET OP: dit bestand enkel ASCII-tekens (geen accenten, geen speciale
# lijnen). De versie wordt verhoogd door tools/versie.mjs (build_deploy.bat).
# Draait NAAST het oude pakket ("3D Print ERP", slug 3d_print_erp, poort
# 3000): andere slug, andere poort (3010), eigen /data (eigen databank).
# Geheimen (Gemini, SMTP) enkel hier, nooit in de databank. Home Assistant
# zelf wordt bereikt via de Supervisor (homeassistant_api), zonder token.
name: "ERP 3D Print & Ontwerp"
description: "Dossiers, offertes, werkbonnen, productie, voorraad en financien voor 3D-print en ontwerp"
version: "0.13.16"
slug: "erp_3d_print_ontwerp"
url: "https://github.com/spiesse42/ERP-3D-Print-en-Ontwerp"
init: false
arch:
  - amd64
homeassistant_api: true
ingress: true
ingress_port: 3010
ingress_stream: true
panel_icon: mdi:printer-3d-nozzle
panel_title: "ERP 3D"
ports:
  3010/tcp: null
ports_description:
  3010/tcp: "Rechtstreekse toegang (standaard uit; Ingress is aanbevolen)"
map:
  - addon_config:rw   # /config: map om een backup terug te zetten (zie README)
options:
  gemini_api_key: ""
  gemini_model: ""
  smtp_user: ""
  smtp_pass: ""
  smtp_from: ""
  smtp_host: ""
  smtp_port: 465
  tijdzone: "Europe/Brussels"
schema:
  gemini_api_key: password?
  gemini_model: str?
  smtp_user: email?
  smtp_pass: password?
  smtp_from: str?
  smtp_host: str?
  smtp_port: port?
  tijdzone: str?
