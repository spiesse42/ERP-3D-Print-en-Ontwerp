<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ERP-schil mockup</title>
<style>
:root{
  --ink:#241a12;--paper:#faf6ee;--surface:#fffcf6;--sunken:#f2ebdc;--line:#e2d8c3;--line-strong:#cdbf9f;
  --muted:#6f6453;--accent:#e2601c;--accent-ink:#fff6ec;--accent-dim:#fbe4d2;--accent-deep:#a4430f;
  --pos:#3f7d4a;--pos-bg:#e4f2e6;--warn:#94600f;--warn-bg:#faedd6;--crit:#b3362a;--crit-bg:#fbe1dd;--info:#335f93;--info-bg:#e6eef7;
  --bar:#241a12;--bar-line:#3c2d1e;--bar-text:#e8dccb;--bar-dim:#b5a28b;
  --radius:3px;--radius-lg:5px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
  --shadow:0 1px 2px rgba(36,26,18,.08),0 6px 18px rgba(36,26,18,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --ink:#f1e7d8;--paper:#18120d;--surface:#221a13;--sunken:#2c2219;--line:#3a2e22;--line-strong:#524230;
  --muted:#b09f88;--accent:#f07a3a;--accent-ink:#1b120b;--accent-dim:#4a2a17;--accent-deep:#f39a66;
  --pos:#86c592;--pos-bg:#1e3224;--warn:#e3ab52;--warn-bg:#3a2b12;--crit:#f08a7c;--crit-bg:#3d1f1a;--info:#8fb4e3;--info-bg:#1b293a;
  --bar:#100b07;--bar-line:#2a2017;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ink:#f1e7d8;--paper:#18120d;--surface:#221a13;--sunken:#2c2219;--line:#3a2e22;--line-strong:#524230;
  --muted:#b09f88;--accent:#f07a3a;--accent-ink:#1b120b;--accent-dim:#4a2a17;--accent-deep:#f39a66;
  --pos:#86c592;--pos-bg:#1e3224;--warn:#e3ab52;--warn-bg:#3a2b12;--crit:#f08a7c;--crit-bg:#3d1f1a;--info:#8fb4e3;--info-bg:#1b293a;
  --bar:#100b07;--bar-line:#2a2017;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--paper)}
body{margin:0;font-family:var(--font);color:var(--ink);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:12px 32px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12.5px}

/* mockup-balk */
.mockbar{max-width:1400px;margin:0 auto 12px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.mockbar .tag{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:700}
.mockbar .tag b{color:var(--accent-deep)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--radius);overflow:hidden;background:var(--sunken)}
.seg button{border:0;background:none;padding:7px 14px;font-weight:600;font-size:13px;display:inline-flex;gap:6px;align-items:center;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.stage{display:flex;justify-content:center}
.app{container-type:inline-size;width:100%;max-width:1400px;background:var(--paper);border:1px solid var(--line-strong);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:720px}
.stage.gsm .app{max-width:390px;height:780px;min-height:0;border-radius:22px;border-width:6px;border-color:var(--bar)}
.appscroll{flex:1;overflow:auto}

/* bovenbalk */
.topbar{background:var(--bar);color:var(--bar-text);display:flex;align-items:center;gap:4px;padding:0 8px;min-height:46px;border-bottom:1px solid var(--bar-line)}
.topbar .home{background:none;border:0;color:var(--bar-text);width:44px;height:44px;display:grid;place-items:center;border-radius:var(--radius)}
.topbar .home:hover{background:var(--bar-line)}
.topbar .appname{font-weight:700;font-size:15px;padding:0 10px 0 4px;white-space:nowrap}
.topbar nav{display:flex;gap:2px;overflow-x:auto}
.topbar nav button{background:none;border:0;color:var(--bar-dim);padding:0 12px;height:46px;font-size:13.5px;white-space:nowrap;border-bottom:2px solid transparent}
.topbar nav button:hover{color:var(--bar-text)}
.topbar nav button.on{color:var(--bar-text);border-bottom-color:var(--accent)}
.topbar .spacer{flex:1}
.topbar .who{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:12px;margin-right:6px}

/* controlepaneel (breadcrumb + zoekbalk + weergaves) */
.cp{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:10px 16px;align-items:center}
.crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.crumbs button{background:none;border:0;padding:0;color:var(--info);font-size:17px}
.crumbs .sep{color:var(--muted)}
.crumbs .cur{font-size:17px;font-weight:600}
.cp .actions{display:flex;gap:8px;flex-wrap:wrap;grid-column:1}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--sunken);border-radius:var(--radius);padding:4px 6px;min-height:38px;flex-wrap:wrap}
.search svg{color:var(--muted);flex:none}
.search input{border:0;background:none;outline:none;flex:1;min-width:90px;font:inherit;color:var(--ink);padding:4px}
.facet{display:inline-flex;align-items:center;gap:0;border-radius:var(--radius);overflow:hidden;font-size:12.5px;border:1px solid var(--line-strong)}
.facet .k{background:var(--ink);color:var(--paper);padding:3px 6px;display:grid;place-items:center}
.facet .v{background:var(--surface);padding:3px 8px}
.facet button{border:0;background:var(--surface);padding:3px 6px;color:var(--muted)}
.cp .right{display:flex;gap:8px;align-items:center;justify-content:flex-end;grid-column:2;flex-wrap:wrap}
.pager{color:var(--muted);font-size:13px}
.views{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--radius);overflow:hidden}
.views button{border:0;background:var(--surface);width:40px;height:34px;display:grid;place-items:center;color:var(--muted)}
.views button[aria-pressed="true"]{background:var(--accent-dim);color:var(--accent-deep)}
.filters{display:flex;gap:6px;flex-wrap:wrap;grid-column:2;justify-content:flex-end}
.chip{border:1px dashed var(--line-strong);background:none;border-radius:999px;padding:4px 10px;font-size:12.5px;color:var(--muted);min-height:30px}
.chip[aria-pressed="true"]{border-style:solid;border-color:var(--accent);color:var(--accent-deep);background:var(--accent-dim)}

.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius);border:1px solid var(--line-strong);background:var(--sunken);color:var(--ink);font-size:13px;font-weight:600;min-height:36px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent-deep);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-deep);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:none;border-color:transparent}

/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;letter-spacing:.01em}
.b-neutral{background:var(--sunken);color:var(--muted)}
.b-info{background:var(--info-bg);color:var(--info)}
.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-pos{background:var(--pos-bg);color:var(--pos)}
.b-crit{background:var(--crit-bg);color:var(--crit)}
.b-accent{background:var(--accent-dim);color:var(--accent-deep)}

/* startscherm */
.home-wrap{padding:40px 24px 56px;max-width:980px;margin:0 auto}
.home-wrap h1{font-size:22px;margin:0 0 4px;text-wrap:balance}
.home-wrap p{margin:0 0 28px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px 14px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;min-height:150px;position:relative}
.tile:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.tile .ic{width:58px;height:58px;border-radius:12px;display:grid;place-items:center;color:#fff}
.tile .t{font-weight:700;font-size:14.5px}
.tile .todo{font-size:12px}
.tile .mocked{position:absolute;top:8px;right:8px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* lijst */
.listwrap{padding:0 0 24px;overflow-x:auto}
table.list{width:100%;border-collapse:collapse;min-width:760px}
table.list th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line-strong);background:var(--surface);position:sticky;top:0;white-space:nowrap}
table.list td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list tr.row{cursor:pointer}
table.list tr.row:hover td{background:var(--accent-dim)}
table.list tr.grp td{background:var(--sunken);font-weight:700;font-size:13px;cursor:default}
table.list .r{text-align:right}
table.list input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
.sub{color:var(--muted);font-size:12.5px}
.prog{display:inline-flex;align-items:center;gap:8px}
.bar{width:70px;height:6px;background:var(--sunken);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent)}
.cards{display:none}

/* kanban */
.kanban{display:flex;gap:12px;padding:14px 16px 24px;overflow-x:auto;align-items:flex-start}
.kcol{flex:0 0 250px;background:var(--sunken);border-radius:var(--radius-lg);padding:8px;display:flex;flex-direction:column;gap:8px}
.kcol h3{margin:2px 4px 4px;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.kcol h3 span{color:var(--muted);font-weight:600}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.kcard:hover{border-color:var(--accent)}
.kcard .t{font-weight:700;font-size:13.5px}
.kcard .meta{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.swatches{display:inline-flex;gap:3px}
.sw{width:12px;height:12px;border-radius:50%;border:1px solid var(--line-strong);display:inline-block}

/* formulier */
.form-actions{padding:10px 16px;display:flex;gap:10px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--surface)}
.form-actions .btns{display:flex;gap:8px;flex-wrap:wrap}
.statusbar{display:flex;align-items:stretch;border:1px solid var(--line-strong);border-radius:var(--radius);overflow:hidden;background:var(--sunken)}
.statusbar span{padding:6px 12px 6px 18px;font-size:12.5px;color:var(--muted);position:relative;white-space:nowrap;display:flex;align-items:center}
.statusbar span:first-child{padding-left:12px}
.statusbar span+span::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:linear-gradient(to bottom right,transparent 49%,var(--line-strong) 50%, transparent 52%) top/100% 50% no-repeat,linear-gradient(to top right,transparent 49%,var(--line-strong) 50%, transparent 52%) bottom/100% 50% no-repeat}
.statusbar span.done{color:var(--ink)}
.statusbar span.cur{background:var(--accent);color:var(--accent-ink);font-weight:700}
.statusbar .cur-mobile{display:none}
.sheet-wrap{padding:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;max-width:1180px;margin:0 auto}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow)}
.sheet-head{padding:18px 22px 6px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sheet-head .nr{font-family:var(--mono);color:var(--muted);font-size:13px}
.sheet-head h2{margin:2px 0 0;font-size:22px;text-wrap:balance}
.smart{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;align-self:flex-start}
.smart button{background:var(--surface);border:0;border-right:1px solid var(--line);padding:6px 14px;display:flex;gap:8px;align-items:center;min-height:48px;text-align:left}
.smart button:last-child{border-right:0}
.smart button:hover{background:var(--accent-dim)}
.smart svg{color:var(--accent-deep)}
.smart .n{font-weight:700;display:block;font-size:14px;line-height:1.1}
.smart .l{font-size:12px;color:var(--muted);display:block}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 36px;padding:10px 22px 16px}
.field{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;padding:5px 0;align-items:baseline}
.field .k{font-weight:700;font-size:13px}
.field .v a,.linkish{color:var(--info);text-decoration:none;background:none;border:0;padding:0}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line-strong);padding:0 22px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;font-weight:600;color:var(--muted);white-space:nowrap;min-height:44px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabpanel{padding:14px 22px 22px}
.lines{width:100%;border-collapse:collapse;min-width:620px}
.lines th{font-size:12px;text-align:left;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
.lines td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.lines .r{text-align:right}
.lines .type{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.addline{display:flex;gap:14px;padding:10px 8px 0;flex-wrap:wrap}
.totals{display:flex;justify-content:flex-end;margin-top:12px}
.totals dl{display:grid;grid-template-columns:auto auto;gap:4px 24px;margin:0;min-width:260px}
.totals dt{color:var(--muted);text-align:right}
.totals dd{margin:0;text-align:right}
.totals .grand{font-size:17px;font-weight:700;border-top:1px solid var(--line-strong);padding-top:6px}
.scroll-x{overflow-x:auto}
.note{font-size:12.5px;color:var(--muted)}
.cmp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.cmp .box{border:1px solid var(--line);border-radius:var(--radius);padding:12px;background:var(--paper)}
.cmp .k{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.cmp .v{font-size:22px;font-weight:700}
.fiche{border:1px dashed var(--line-strong);border-radius:var(--radius);padding:14px;background:var(--paper);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 28px}
.fiche .field{grid-template-columns:140px minmax(0,1fr)}
.inp{border:1px solid var(--line-strong);background:var(--sunken);border-radius:var(--radius);padding:7px 10px;font:inherit;color:var(--ink);width:100%}
.rows2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px;align-items:end}
.rows2 label{display:block;font-size:12.5px;font-weight:700;margin-bottom:4px}

/* historiek */
.chatter{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:14px 22px 18px}
.chatter h3{margin:0 0 10px;font-size:14px}
.compose{display:flex;gap:8px;margin-bottom:14px}
.compose input{flex:1}
.day{font-size:12px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:10px;margin:14px 0 6px}
.day::after{content:"";flex:1;height:1px;background:var(--line)}
.ev{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:6px 0}
.ev .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--sunken);color:var(--muted)}
.ev .dot.a{background:var(--accent-dim);color:var(--accent-deep)}
.ev .dot.p{background:var(--pos-bg);color:var(--pos)}
.ev .dot.c{background:var(--crit-bg);color:var(--crit)}
.ev .top{font-size:12.5px;color:var(--muted)}
.ev .top b{color:var(--ink)}

/* productie */
.alert{margin:14px 16px 0;border:1px solid var(--warn);background:var(--warn-bg);border-radius:var(--radius-lg);padding:12px 14px;display:flex;gap:12px 18px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.alert .txt{display:flex;gap:10px;align-items:flex-start;color:var(--ink)}
.alert .txt svg{color:var(--warn);flex:none;margin-top:2px}
.alert .opts{display:flex;gap:8px;flex-wrap:wrap}
.picklist{flex-basis:100%;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--warn);padding-top:10px}
.pickhead{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.pick{display:flex;justify-content:space-between;align-items:center;gap:8px 14px;flex-wrap:wrap;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:9px 12px;min-height:48px;width:100%}
.pick:hover:not(:disabled){border-color:var(--accent)}
.pick:disabled{opacity:.6;cursor:not-allowed}
.pick .pr{display:flex;gap:6px;flex-wrap:wrap}
.alert.ok{border-color:var(--pos);background:var(--pos-bg)}
.alert.ok .txt svg{color:var(--pos)}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:14px 16px 24px}
.pcol{display:flex;flex-direction:column;gap:10px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden}
.pcard .ph{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.pcard .ph b{font-size:14.5px}
.pcard .pb{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.tele{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tele div{background:var(--sunken);border-radius:var(--radius);padding:6px;text-align:center}
.tele .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:block}
.tele .v{font-weight:700;font-size:13.5px}
.layerbar{height:10px;border-radius:2px;background:repeating-linear-gradient(to right,var(--sunken) 0 3px,var(--line) 3px 4px);border:1px solid var(--line);overflow:hidden}
.layerbar i{display:block;height:100%;background:repeating-linear-gradient(to right,var(--accent) 0 3px,var(--accent-deep) 3px 4px)}
.qhead{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:2px 2px 0}
.qitem{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:9px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:grab}
.qitem .grip{color:var(--line-strong);margin-right:8px}
.pcard .pf{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.spool{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.spool button{border:1px solid var(--line);background:var(--paper);border-radius:var(--radius);padding:8px;display:flex;gap:8px;align-items:center;text-align:left;min-height:44px}
.spool button:hover{border-color:var(--accent)}
.spool .ring{width:26px;height:26px;border-radius:50%;border:6px solid;flex:none;box-shadow:inset 0 0 0 3px var(--paper)}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:var(--radius-lg);font-size:13.5px;box-shadow:var(--shadow);max-width:calc(100% - 32px);z-index:10}

/* ── smal scherm (gsm-kader of echte gsm) ── */
@container (max-width:700px){
  .topbar nav{display:none}
  .cp{grid-template-columns:minmax(0,1fr)}
  .cp .right,.filters,.cp .actions{grid-column:1;justify-content:flex-start}
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .tile{min-height:120px;padding:12px 6px}
  .tile .ic{width:48px;height:48px}
  .home-wrap{padding:24px 12px 40px}
  .listwrap table{display:none}
  .cards{display:flex;flex-direction:column;gap:8px;padding:12px}
  .cards .grp{font-weight:700;font-size:13px;margin-top:6px}

function listTable(cols,rows){
  // cols: [label, fn(row), cls]; rows: [{_open, ...}]; groups: rows with _grp
  let body='',cards='';
  rows.forEach(r=>{
    if(r._grp){body+='<tr class="grp"><td colspan="'+cols.length+'">'+r._grp+'</td></tr>';cards+='<div class="grp">'+r._grp+'</div>';return;}
    body+='<tr class="row" '+(r._open?'data-open="'+r._open+'"':'')+'>'+cols.map(c=>'<td class="'+(c[2]||'')+'">'+c[1](r)+'</td>').join('')+'</tr>';
    cards+='<button type="button" class="mcard" '+(r._open?'data-open="'+r._open+'"':'')+'><span class="l1"><b>'+r._t1+'</b><span class="num">'+(r._t2||'')+'</span></span>'+(r._t3?'<span>'+r._t3+'</span>':'')+'<span class="l1"><span class="mono sub">'+(r._t4||'')+'</span>'+(r._t5||'')+'</span></button>';
  });
  if(!rows.length){body='<tr><td colspan="'+cols.length+'" class="ph-empty">Niets gevonden.</td></tr>';cards='<div class="ph-empty">Niets gevonden.</div>';}
  return '<div class="listwrap"><table class="list"><thead><tr>'+cols.map(c=>'<th class="'+(c[2]||'')+'">'+c[0]+'</th>').join('')+'</tr></thead><tbody>'+body+'</tbody></table><div class="cards">'+cards+'</div></div>';
}

const MAAND=[['jan',210],['feb',340],['mrt',280],['apr',520],['mei',610],['jun',450],['jul',380],['aug',720],['sep',872.5]];
function barChart(){
  const W=640,H=220,pl=44,pb=26,pt=10,max=1000,bw=(W-pl)/MAAND.length;
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Omzet per maand 2026">';
  [0,250,500,750,1000].forEach(v=>{const y=pt+(H-pt-pb)*(1-v/max);s+='<line x1="'+pl+'" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/><text x="'+(pl-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">€ '+v+'</text>';});
  MAAND.forEach((m,i)=>{const h=(H-pt-pb)*m[1]/max,x=pl+i*bw+bw*0.22,w=bw*0.56,y=H-pb-h;
    s+='<path d="M'+x+' '+(H-pb)+' V'+(y+4)+' Q'+x+' '+y+' '+(x+4)+' '+y+' H'+(x+w-4)+' Q'+(x+w)+' '+y+' '+(x+w)+' '+(y+4)+' V'+(H-pb)+' Z" fill="'+(i===MAAND.length-1?'var(--accent)':'var(--accent-deep)')+'" opacity="'+(i===MAAND.length-1?1:.55)+'"/>'+
    '<rect x="'+(pl+i*bw)+'" y="'+pt+'" width="'+bw+'" height="'+(H-pt-pb)+'" fill="transparent" data-tip="'+m[0]+' · '+eur(m[1]).replace('€ ','€&#160;')+'" data-x="'+((pl+i*bw+bw/2)/W*100)+'" data-y="'+(y/H*100)+'"/>'+
    '<text x="'+(pl+i*bw+bw/2)+'" y="'+(H-8)+'" text-anchor="middle" font-size="11" fill="var(--muted)">'+m[0]+'</text>';});
  s+='<line x1="'+pl+'" x2="'+W+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'" stroke="var(--line-strong)"/></svg>';

}

   '<div class="panel"><h3>UBL-export: aankoopfacturen</h3><div class="pbody"><div class="drop">'+I.receipt+'<b>Sleep de UBL-zip hierheen</b><span>Maakt aankopen aan zonder OCR (Peppol-facturen)</span><button type="button" class="btn" data-t="imp">Voorbeeld inlezen</button></div></div></div></div>'+res+'</div></div>';

/* ══════════ INSTELLINGEN ══════════ */

  if(S.setSec==='tarieven') c='<div class="panel"><h3>Tarieven <span class="sub" style="font-weight:400">gebruikt door de rekenmotor</span></h3><div class="pbody"><div class="fgrid"><div class="fgroup">Energie &amp; machine</div>'+f('t1','Elektriciteitsprijs','0,35','€/kWh')+f('t2','Machinekost (globaal, terugval)','0,13','€/u')+f('t3','BMCU-slijtage per multicolor print','0,10','€')+'<div class="fgroup">Marge &amp; faalfactor</div>'+f('t4','Grens klein/groot (printtijd)','3','u')+f('t5','Marge klein','18','%')+f('t6','Marge groot','10','%')+f('t7','Faalfactor (enkel op materiaal)','10','%')+'<div class="fgroup">Arbeid</div>'+f('t8','Vaste voorbereiding per print','10','min')+f('t9','Vaste nabewerking per print','5','min')+f('t10','Arbeid (regie)','15,00','€/u')+f('t11','Ontwerp op maat (regie)','25,00','€/u')+f('t12','Uitgebreide nabewerking (regie)','20,00','€/u')+'</div><div style="margin-top:14px"><button type="button" class="btn primary" data-soon="Opgeslagen">Opslaan</button></div></div></div>';
  if(S.setSec==='materiaal'){const g={};ART.filter(a=>a.soort==='filament').forEach(a=>{g[a.groep]=g[a.groep]||{p:a.prijs,min:a.min,k:[]};g[a.groep].k.push(a.kleur);});
    c='<div class="panel"><h3>Materiaalprijzen <button type="button" class="btn" data-soon="Nieuwe prijsgroep">Nieuw</button></h3><div class="pbody"><table class="mini"><thead><tr><th>Merk · type</th><th>Kleuren</th><th class="r">Verkoopprijs</th><th class="r">Min. rollen per kleur</th></tr></thead><tbody>'+Object.entries(g).map(([n,v])=>'<tr class="clk" data-soon="'+n+' bewerken"><td><b>'+n+'</b></td><td>'+sw(v.k)+'</td><td class="r num">'+v.p+'</td><td class="r num">'+v.min+'</td></tr>').join('')+'</tbody></table><p class="note">Materiaalkost = gewicht × verkoopprijs/kg × faalfactor. Geen aparte marge op materiaal.</p></div></div>';}
  if(S.setSec==='printers') c='<div class="panel"><h3>Printers <button type="button" class="btn" data-soon="Nieuwe printer">Nieuw</button></h3><div class="pbody"><table class="mini"><thead><tr><th>Printer</th><th>Adapter</th><th class="r">Machinekost</th><th class="r">Gem. verbruik</th><th>BMCU</th><th>Auto-runs</th></tr></thead><tbody>'+
    [['Bambu A1 Mini','Bambu via Home Assistant','€ 0,13/u','95 W','Ja','Aan'],['Ender 3 S1 Pro','Klipper via Moonraker','€ 0,13/u','150 W','Nee','Aan'],['AnyCubic Kobra S1 Pro','Manueel (cloud)','€ 0,15/u','110 W','Ace Pro','—']].map(p=>'<tr class="clk" data-soon="'+p[0]+' bewerken"><td><b>'+p[0]+'</b></td><td>'+p[1]+'</td><td class="r num">'+p[2]+'</td><td class="r num">'+p[3]+'</td><td>'+p[4]+'</td><td>'+p[5]+'</td></tr>').join('')+'</tbody></table><p class="note">Per adapter kies je de entiteiten uit een lijst, met een test per entiteit.</p></div></div>';
  if(S.setSec==='bedrijf') c='<div class="panel"><h3>Bedrijfsgegevens <span class="sub" style="font-weight:400">op offerte, werkbon en pakbon</span></h3><div class="pbody"><div class="fgrid">'+[['b1','Naam','3Dplezier'],['b2','Ondernemingsnr.','[BE0XXX.XXX.XXX]'],['b3','Adres','[straat nr, postcode gemeente]'],['b4','E-mail','[e-mail]'],['b5','IBAN','[BE.. .... .... ....]'],['b6','Vermelding btw','Bijzondere vrijstellingsregeling kleine ondernemingen']].map(x=>'<div><label for="'+x[0]+'">'+x[1]+'</label><input id="'+x[0]+'" class="inp" value="'+x[2]+'"></div>').join('')+'</div><div style="margin-top:14px"><button type="button" class="btn primary" data-soon="Opgeslagen">Opslaan</button></div></div></div>';
  if(S.setSec==='integraties') c='<div class="panel"><h3>Integraties</h3><div class="pbody"><table class="mini"><tbody><tr><td><b>Home Assistant</b><div class="sub">printers, wattage, kWh</div></td><td>'+bdg('Verbonden','b-pos')+'</td><td class="sub">token via add-on-configuratie</td><td><button type="button" class="btn" data-soon="Verbinding OK">Testen</button></td></tr><tr><td><b>Moonraker</b><div class="sub">Ender 3 S1 Pro</div></td><td>'+bdg('Verbonden','b-pos')+'</td><td class="sub">adres in printerinstellingen</td><td><button type="button" class="btn" data-soon="Verbinding OK">Testen</button></td></tr><tr><td><b>Gemini</b><div class="sub">OCR van bonnetjes</div></td><td>'+bdg('Ingesteld','b-pos')+'</td><td class="sub">sleutel via add-on-configuratie</td><td></td></tr><tr><td><b>Accountable</b><div class="sub">facturen, bonnetjes, Peppol</div></td><td>'+bdg('Via export','b-neutral')+'</td><td class="sub">geen API · import onder Financiën</td><td><button type="button" class="btn" data-nav="financien/import">Openen</button></td></tr></tbody></table></div></div>';

/* ══════════ router ══════════ */
function view(){
  if(S.app==='home')return viewHome();
  const [t,id]=(S.rec||'').split(':');
  if(S.app==='dossiers'){ if(S.newDos)return viewNieuwDossier(); if(t==='dos')return viewDossier(id); return {dossiers:viewDossiers,leveringen:viewLeveringen,offertes:viewOffertes}[S.page](); }
  if(S.app==='productie')return {printers:viewPrinters,opdrachten:viewOpdrachten,runs:viewRuns}[S.page]();
  if(S.app==='inkoop'){ if(t==='ak')return viewAankoop(id); return {aankopen:viewAankopen,inlezen:viewInlezen,leveranciers:viewLeveranciers}[S.page](); }
  if(S.app==='voorraad'){ if(t==='art')return viewArtikel(id); return {artikelen:viewArtikelen,tebestellen:viewTeBestellen,mutaties:viewMutaties}[S.page](); }
  if(S.app==='klanten'){ if(t==='kl')return viewKlant(id); return viewKlanten(); }
  if(S.app==='financien')return {overzicht:viewFinancien,import:viewImport}[S.page]();
  if(S.app==='instellingen')return viewInstellingen();
}
const app=document.getElementById('app');
function render(keepFocus){
  app.innerHTML=topbar()+view();
  const q=document.getElementById('q');
  if(q){q.addEventListener('input',()=>{S.q=q.value;render(true);});if(keepFocus){q.focus();q.setSelectionRange(q.value.length,q.value.length);}}
  const ch=document.getElementById('chart');
  if(ch){const tip=document.getElementById('tip');ch.addEventListener('mousemove',e=>{const r=e.target.closest('[data-tip]');if(!r){tip.hidden=true;return;}tip.innerHTML=r.dataset.tip;tip.style.left=r.dataset.x+'%';tip.style.top=r.dataset.y+'%';tip.hidden=false;});ch.addEventListener('mouseleave',()=>tip.hidden=true);}
}
function scrollTop(){const s=app.querySelector('.appscroll');if(s)s.scrollTop=0;}
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600);}
function openRec(v){
  const [t,id]=v.split(':');
  if(t==='nav'){const [a,p]=id.split('/');go(a,p);return;}
  if(t==='dos'){if(DOSSIERS.find(d=>d.nr===id)){go('dossiers','dossiers','dos:'+id);}return;}
  if(t==='kl'){go('klanten','klanten','kl:'+id);return;}
  if(t==='art'){go('voorraad','artikelen','art:'+id);return;}
  if(t==='ak'){go('inkoop','aankopen','ak:'+id);return;}
}
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-nav],[data-view],[data-t],[data-open],[data-tab],[data-run],[data-soon],[data-sec],[data-klf],#copyFiche');
  if(!b||b.disabled)return;
  if(b.dataset.sec&&!b.dataset.nav){S.setSec=b.dataset.sec;render();return;}
  if(b.dataset.nav){if(b.dataset.nav==='home'){S.app='home';S.rec=null;}else{const [a,p]=b.dataset.nav.split('/');go(a,p);if(b.dataset.sec)S.setSec=b.dataset.sec;}render();scrollTop();return;}
  if(b.dataset.klf){go('dossiers','dossiers');S.klantF=b.dataset.klf;S.open=false;render();return;}
  if(b.dataset.view){S.view=b.dataset.view;render();return;}
  if(b.dataset.t){const k=b.dataset.t;
    if(k==='goAfr'){toast('Opent de overnamefiche. Uitgewerkt in D-2026-0012, tab Afrekening.');return;}
    if(k==='tabPart'){S.tab='partijen';render();return;}
    if(k==='newDos'){if(b.dataset.kl){go('dossiers','dossiers');S.newDos=true;render();setTimeout(()=>{const s=document.getElementById('nd-klant');if(s)s.value=klant(b.dataset.kl).naam;},0);return;}S.newDos=!S.newDos;render();scrollTop();return;}
    if(k==='klantF'){S.klantF=null;render();return;}
    if(k==='x'){toast('Facet · niet uitgewerkt in deze mockup.');return;}
    S[k]=!S[k];render();return;}
  if(b.dataset.open){openRec(b.dataset.open);render();scrollTop();return;}
  if(b.dataset.tab){S.tab=b.dataset.tab;render();return;}
  if(b.dataset.run){S.run=b.dataset.run==='reset'?null:b.dataset.run;S.pick=false;render();toast(S.run?'Run #89 gekoppeld.':'Koppeling ongedaan gemaakt.');return;}
  if(b.id==='copyFiche'){const txt='Jeugdhuis De Sleutel vzw\n50 sleutelhangers met logo (D-2026-0012)\nTotaal: € 114,70';
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>toast('Overnamefiche gekopieerd.'),()=>toast('Kopiëren lukt hier niet; in het echte ERP wel.'));}else toast('Kopiëren lukt hier niet; in het echte ERP wel.');return;}
  if(b.dataset.soon)toast(b.dataset.soon+' · niet uitgewerkt in deze mockup.');
});
function setMode(g){S.gsm=g;document.getElementById('stage').classList.toggle('gsm',g);document.getElementById('mDesk').setAttribute('aria-pressed',!g);document.getElementById('mGsm').setAttribute('aria-pressed',g);}
document.getElementById('mDesk').addEventListener('click',()=>setMode(false));
document.getElementById('mGsm').addEventListener('click',()=>setMode(true));
render();
})();
</script>
